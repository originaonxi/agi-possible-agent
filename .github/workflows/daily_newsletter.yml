name: Daily AGI Possible Newsletter

on:
  schedule:
    # 8:00 AM PST = 16:00 UTC daily
    - cron: '0 16 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI (for testing)

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit DB back to repo

    steps:
      - name: Checkout repo (with DB)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python agent.py

      - name: Save dedup database back to repo
        run: |
          git config user.name "agi-possible-bot"
          git config user.email "bot@agi-possible.ai"
          git add agi_possible.db || true
          git diff --cached --quiet || git commit -m "chore: update seen-papers database [skip ci]"
          git push || true
